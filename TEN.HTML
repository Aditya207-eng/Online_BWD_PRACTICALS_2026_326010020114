<!DOCTYPE html>
<html>
<head>
  <title>Marwadi University</title>
  <style>
    body { font-family: Arial; background: #f4f6f8; margin: 0; }
    header { background: #1a3c6e; color: white; text-align: center; padding: 20px; }
    section { background: white; margin: 15px auto; padding: 15px; max-width: 800px; }
    iframe { width: 100%; height: 350px; }
  </style>
</head>
<body>

  <header>
    <h1>Marwadi University</h1>
    <p>Rajkot, Gujarat, India</p>
  </header>

  <section>
    <h2>About the College</h2>
    <p>Marwadi University offers programs in engineering, management, computer applications and science.</p>
  </section>

  <section>
    <h2>Your Location</h2>
    <button onclick="getLocation()">Show My Location</button>
    <p id="result"></p>
  </section>

  <section>
    <h2>College Map</h2>
    <iframe src="https://www.google.com/maps?q=Marwadi+University+Rajkot&output=embed"></iframe>
  </section>

  <script>
    var result = document.getElementById("result");

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        result.innerHTML = "Geolocation not supported.";
      }
    }

    function showPosition(position) {
      result.innerHTML = "Latitude: " + position.coords.latitude +
                         "<br>Longitude: " + position.coords.longitude;
    }

    function showError(error) {
      result.innerHTML = "Could not get location.";
    }
  </script>

</body>
</html>
